name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  quality:
    name: TypeCheck + Lint + Unit Tests + Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://test.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'test-anon-key' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'test-service-key' }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || '' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/test' }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL || 'http://localhost:3000' }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY || 'test-key' }}
      ZAI_BASE_URL: ${{ secrets.ZAI_BASE_URL || 'https://open.bigmodel.cn/api/paas/v4' }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || 'test-key' }}
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeCheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test
        env:
          CI: true

      # CP-SEC-006 (T4, 2026-11-04): barrera anti-desincronización con
      # docs/SECURITY_CI_GATE_FINDINGS_BACKLOG.md — el backlog está en 0; si un
      # endpoint de mutación pierde Zod o auth, este paso ROMPE el CI aunque el
      # backlog no se haya actualizado. Sin credenciales (estático).
      - name: SEC-TS gate (endpoints sin Zod/auth)
        run: node scripts/ci-gate-ts-checks.js

      - name: Build
        run: NODE_OPTIONS="--max-old-space-size=4096" bun run build

      # Bundle Gate (W2/W3): verifica contra los artefactos del build de
      # este commit que jspdf/html2canvas/jspdf-autotable/@e965/xlsx no
      # vuelvan a entrar en la carga inicial del shell ni de las vistas
      # protegidas (POS, Tabla de Venta, Vitrina Pública).
      # Reutiliza el build anterior — NO compila una segunda vez.
      # Exit 1 = regresión confirmada · Exit 2 = artefactos/formato no
      # verificable (BLOCKED). Ambos fallan el check.
      - name: Bundle gate (W2/W3 regression)
        run: node scripts/bundle-gate/check-bundle-gate.mjs --next-dir .next

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit 2>/dev/null || echo "Audit completed with warnings"
        continue-on-error: true

      - name: Check for hardcoded secrets
        run: |
          if grep -r --include="*.ts" --include="*.tsx" --include="*.js" \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=e2e \
            --exclude-dir=src/__tests__ \
            -E "sb_secret_[a-zA-Z0-9_-]{20,}|sbp_[a-f0-9]{40,}" \
            src/ 2>/dev/null; then
            echo "Potential hardcoded secrets found!"
            exit 1
          else
            echo "No hardcoded secrets detected"
          fi

      - name: BOLA contract test
        run: node scripts/bola-contract-test.cjs
        # V2.12.38: Verifica que TODOS los endpoints multi-tenant bajo
        # /api/production-orders/ y /api/accounts-receivable tengan el guard
        # explícito de store_id (defense-in-depth sobre RLS)

      - name: Security contract (static, CI-safe)
        run: node scripts/security-contract-test-static.cjs
        # REM-INV-5: engancha el security contract a CI sin secretos de producción.
        # Capa A: re-ejecuta los 4 checks + pin REM-INV-2R sobre el surface LIVE
        # certificado (supabase/security-contract/contract-surface.sql, 134 funciones).
        # Capa B: replay de migraciones; una violación NUEVA en un PR bloquea el build
        # (baseline histórico revisado en ci-gate-allowlist.json).
        # El contract LIVE (scripts/security-contract-test.cjs) requiere
        # SUPABASE_ACCESS_TOKEN y NUNCA debe ejecutarse en CI.

      - name: Guard de producción — manifiesto de escritores (CP-INFRA-019-FOLLOWUP)
        run: node scripts/lib/check-writers.mjs
        # Fail-closed ante scripts NUEVOS que escriban contra Supabase (SQL,
        # RPC, service_role, Management API o métodos POST/PATCH/PUT/DELETE):
        # todo archivo de scripts/ con señal de escritor debe estar declarado
        # en scripts/lib/writers.manifest.json (guard / aislamiento E2E /
        # excepción justificada). Alcance: solo scripts/ — ver limitaciones en
        # docs/audits/CP-INFRA-019_GUARD_PRODUCCION_AUDIT.md.
