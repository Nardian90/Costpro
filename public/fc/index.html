<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>COSTPRO · Ficha de Costo</title>
<link rel="icon" href="icons/icon-192.png">
<script>
/* =====================================================================
   COSTPRO FC-MVP · puente de identidad same-origin (entry point /fc/)
   v2 — 2026-09-16 · FC ACCESS FLOW FIX (una sola identidad COSTPRO)
   ---------------------------------------------------------------------
   Cadena:  /fc → 307 aquí → este wrapper decide → FC.html (superficie
   de producto de COSTPRO; el release canónico v12.10.0 de fichascosto
   con 11 parches de identidad documentados en release-manifest.json).

   DECISIÓN DE ENTRADA (Flujo 1 y 2 del mandato):
   · Hay token de sesión COSTPRO (sb-<ref>-auth-token en este mismo
     origen) → se siembra el sobre FC_CLOUD_SESSION_V1 (que FC ya sabe
     leer para plan/sync) y se entra a FC.html. NO se vuelve a pedir
     login: la identidad es la de COSTPRO.
   · No hay token COSTPRO → el usuario NO está autenticado → se le
     lleva al LOGIN DE COSTPRO (/?login=1&returnTo=%2Ffc%2F), nunca a
     un login propio de FC. returnTo es SOLO navegación (allowlist en
     el servidor/app COSTPRO); la autorización sigue siendo sesión
     Supabase + RLS.

   Garantías de diseño (invariantes v1 conservadas):
   · FAIL-OPEN: cualquier error → redirect limpio.
   · NUNCA borra: este puente jamás elimina FC_CLOUD_SESSION_V1 ni
     ninguna sesión local (FC conserva su trabajo y su contexto).
   · Sin red: 0 fetches aquí. Con sb-token persistido la entrada
     offline funciona (FC continuará en modo local con su perfil
     cacheado). Sin sesión COSTPRO y sin red no hay contexto que
     preservar: offline NO otorga permisos nuevos.
   · Seguridad: solo lee credenciales del propio usuario en su propio
     navegador (same-origin); todas las operaciones de FC siguen
     sujetas a RLS (created_by = auth.uid()) en el servidor.
     Offline ≠ bypass de autorización.
   ===================================================================== */
(function () {
  'use strict';
  var REF = 'wthkddeleylijmonclxg';           /* proyecto Supabase compartido COSTPRO/FC */
  var SB_KEY = 'sb-' + REF + '-auth-token';   /* storage por defecto de supabase-js v2 */
  var FC_KEY = 'FC_CLOUD_SESSION_V1';         /* sobre de sesión que FcCloud.init() ya consume */
  var LOGIN_URL = '/?login=1&returnTo=%2Ffc%2F'; /* login COSTPRO; returnTo = navegación, no autorización */

  function seed() {
    try {
      var raw = localStorage.getItem(SB_KEY);
      if (!raw) return;
      var sb = JSON.parse(raw);
      var sess = sb && sb.currentSession ? sb.currentSession : sb;  /* compat formatos antiguos */
      var at = sess && sess.access_token;
      var rt = sess && sess.refresh_token;
      if (!at || !rt) return;
      var u = sess.user || {};
      /* expires_at de supabase-js va en SEGUNDOS; FC espera MILISEGUNDOS */
      var expMs = sess.expires_at
        ? (Number(sess.expires_at) * 1000)
        : (Date.now() + (Number(sess.expires_in) || 3600) * 1000);
      var prev = null;
      try { prev = JSON.parse(localStorage.getItem(FC_KEY) || 'null'); } catch (e) { prev = null; }
      if (prev && prev.v === 1 && prev.refresh_token === rt) return;  /* ya sembrado: no pisar */
      localStorage.setItem(FC_KEY, JSON.stringify({
        v: 1,
        access_token: at,
        refresh_token: rt,
        expires_at: expMs,
        user: { id: u.id, email: u.email || '' },
        obtainedAt: new Date().toISOString()
      }));
    } catch (e) { /* fail-open */ }
  }

  try {
    var hasCpSession = !!localStorage.getItem(SB_KEY);
    seed();
    /* Entrada solo con identidad COSTPRO presente en este origen.
       El sobre previo no basta para DECIDIR la entrada (puede quedar de
       una sesión ya cerrada): la decisión la da el token vivo de
       COSTPRO. Nada se borra en ningún caso. */
    if (hasCpSession) {
      location.replace('./FC.html');
    } else {
      location.replace(LOGIN_URL);
    }
  } catch (e) {
    location.replace(LOGIN_URL); /* fail-closed a login COSTPRO */
  }
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=./FC.html"></noscript>
</head>
<body></body>
</html>
