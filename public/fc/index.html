<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>COSTPRO · Ficha de Costo</title>
<link rel="icon" href="icons/icon-192.png">
<script>
/* =====================================================================
   COSTPRO FC-MVP · puente de identidad same-origin (entry point /fc/)
   ---------------------------------------------------------------------
   MISIÓN: integración MVP Ficha de Costo en COSTPRO (cambio mínimo).
   Este wrapper NO toca el artefacto canónico FC.release.html (byte-exacto,
   sha256 fijado en ./release-manifest.json): solo SIEMBRA el sobre de
   sesión que FC ya sabe leer (FC_CLOUD_SESSION_V1) a partir del token
   estándar de supabase-js de COSTPRO (sb-<ref>-auth-token), que existe en
   este MISMO origen porque /fc/ se sirve desde el dominio de COSTPRO.

   Garantías de diseño:
   · FAIL-OPEN: cualquier error → redirect limpio; FC arranca en su modo
     local/guest de siempre (sin red funciona igual).
   · NUNCA borra: si no hay sesión COSTPRO, no toca FC_CLOUD_SESSION_V1
     (una sesión iniciada desde la propia FC se conserva).
   · Identidad COSTPRO tiene precedencia en la entrada (un solo ecosistema);
     si el refresh_token ya sembrado es el mismo, no se reescribe.
   · Sin red: 0 fetches aquí; si el token sembrado está expirado FC hará
     su propio refresh (o quedará en modo offline con plan cacheado).
   · Seguridad: lee solo credenciales del propio usuario en su propio
     navegador (same-origin); todas las operaciones de FC siguen sujetas
     a RLS (created_by = auth.uid()) en el servidor. Offline ≠ bypass.
   ===================================================================== */
(function () {
  'use strict';
  var REF = 'wthkddeleylijmonclxg';           /* proyecto Supabase compartido COSTPRO/FC */
  var SB_KEY = 'sb-' + REF + '-auth-token';   /* storage por defecto de supabase-js v2 */
  var FC_KEY = 'FC_CLOUD_SESSION_V1';         /* sobre de sesión que FcCloud.init() ya consume */

  function seed() {
    try {
      var raw = localStorage.getItem(SB_KEY);
      if (!raw) return;                        /* sin sesión COSTPRO → FC usa la suya o guest */
      var sb = JSON.parse(raw);
      var sess = sb && sb.currentSession ? sb.currentSession : sb;  /* compat formatos antiguos */
      var at = sess && sess.access_token;
      var rt = sess && sess.refresh_token;
      if (!at || !rt) return;
      var u = sess.user || {};
      /* expires_at de supabase-js va en SEGUNDOS; FC espera MILISEGUNDOS */
      var expMs = sess.expires_at
        ? (Number(sess.expires_at) * 1000)
        : (Date.now() + (Number(sess.expires_in) || 3600) * 1000);
      var prev = null;
      try { prev = JSON.parse(localStorage.getItem(FC_KEY) || 'null'); } catch (e) { prev = null; }
      if (prev && prev.v === 1 && prev.refresh_token === rt) return;  /* ya sembrado: no pisar */
      localStorage.setItem(FC_KEY, JSON.stringify({
        v: 1,
        access_token: at,
        refresh_token: rt,
        expires_at: expMs,
        user: { id: u.id, email: u.email || '' },
        obtainedAt: new Date().toISOString()
      }));
    } catch (e) { /* fail-open */ }
  }

  seed();
  location.replace('./FC.release.html');
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=./FC.release.html"></noscript>
</head>
<body></body>
</html>
